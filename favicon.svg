<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <title>Pushmi-pullyu</title>
  <!-- After Hugh Lofting's 1920 drawing: one long body, a horned head at each end, facing away. -->
  <rect width="64" height="64" rx="14" fill="#3a8856"/>
  <g id="half" fill="#fff" stroke="#fff" stroke-linecap="round">
    <line x1="17" y1="37" x2="16" y2="55" stroke-width="3"/>
    <line x1="23" y1="38" x2="24" y2="55" stroke-width="3"/>
    <line x1="17" y1="33" x2="14" y2="21" stroke-width="5.5"/>
    <ellipse cx="9" cy="21" rx="7.5" ry="4" transform="rotate(18 9 21)" stroke="none"/>
    <line x1="14" y1="18" x2="16" y2="7" stroke-width="2.5"/>
    <line x1="11.5" y1="18" x2="9" y2="13" stroke-width="2.5"/>
    <circle cx="11.5" cy="19.5" r="1.3" fill="#3a8856" stroke="none"/>
  </g>
  <use xlink:href="#half" transform="matrix(-1 0 0 1 64 0)"/>
  <rect x="13" y="29" width="38" height="11" rx="5.5" fill="#fff"/>
</svg>
