<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TooToo</title>
<meta name="description" content="Content brought to you by TooToo, the single-file GitHub repository viewer.">
<meta name="tootoo-release" content="dev">
<meta name="tootoo-built" content="dev">

<!-- TOOTOO-CONFIG-START: your settings. Updates carry this block forward unchanged. -->
<script>
window.TOOTOO_CONFIG = {

  // Which repo to show. Empty = detect from ?owner=&repo=, then the *.github.io address
  // owner: '',                  // GitHub user or organization, e.g. 'theo-armour'
  // repo: '',                   // repository name, e.g. 'pages'
  // branch: '',                 // empty = the repo's default branch
  // startFile: '',              // the file to open first, e.g. '0-agenda.md' or a folder; empty = the README

  // view: 'browser',            // the app type; v1 has 'browser' only

  // Branding
  // appName: 'TooToo',          // name in the header and the page title
  // subtitle: '',               // short line beside the name
  // description: '',            // a sentence about this repo, for About and search engines
  // themeColor: '',             // highlight color, e.g. '#3a8856'; empty = the built-in color
  // headingFontUrl: '',         // stylesheet URL for a heading font, e.g. a Google Fonts link
  // headingFont: '',            // CSS font-family for headings, e.g. '"Patua One", serif'
  // faviconFile: '',            // icon file name or URL; empty = no icon
  // sourceRepoUrl: 'https://github.com/pushme-pullyou/tootoo', // the "made with" link in About
  // homeUrl: '',                // when set, the header shows a ⌂ link to this page

  // storagePrefix: 'tootoo',    // prefix for saved settings; give each install its own

  // What the tree hides
  // hiddenFolders: [],          // folder names to hide, at any depth, e.g. [ 'Images' ]
  // hiddenFiles: [],            // file names to hide, at any depth (index.bak is always hidden)
  // hideDatedBackups: true,     // hide backups named like "name-2026-11-21-08-30.md"
  // autoOpenFolderReadme: true, // opening a folder shows its README the first time

  // Footer
  // rightsText: 'No rights reserved', // shown after "© <year> <owner>"
  // rightsOwners: null,         // null = every repo; [ 'login' ] = only these owners; [] = never
  // links: [],                  // links in the footer and About, e.g. [ { label: 'Pages', url: 'https://example.com/' } ]

  // Search engines
  // noindex: false,             // true asks search engines not to list this site

  // Updates
  // checkForUpdates: true,      // tell the maintainer when a newer release exists (at most once a day)
  // updateUrl: 'https://pushme-pullyou.github.io/tootoo/releases/latest.json', // where to look

};
</script>
<!-- TOOTOO-CONFIG-END -->

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.1/dist/purify.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app"></div>

<!-- App scripts in load order. tests/index.html loads the same list. -->
<script src="core/config.js"></script>
<script src="core/state.js"></script>
<script src="core/router.js"></script>
<script src="core/update.js"></script>
<script src="sources/github.js"></script>
<script src="sources/local.js"></script>
<script src="loaders/markdown.js"></script>
<script src="loaders/code.js"></script>
<script src="loaders/media.js"></script>
<script src="loaders/text.js"></script>
<script src="loaders/pdf.js"></script>
<script src="loaders/csv.js"></script>
<script src="loaders/html.js"></script>
<script src="loaders/index.js"></script>
<script src="ui/shell.js"></script>
<script src="ui/tree.js"></script>
<script src="ui/content.js"></script>
<script src="views/browser.js"></script>

<script>
// Startup: mount the view CONFIG.view names (v1 has 'browser' only).
{
  const views = { browser: BrowserView };
  ( views[ CONFIG.view ] || BrowserView ).mount( document.getElementById( 'app' ) );
}
</script>

</body>
</html>
